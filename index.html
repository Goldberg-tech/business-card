<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080c14">
    <title>Никита — Разработка & Telegram</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #080c14 0%, #0f1419 100%);
            color: #e8e8e8;
            font-family: 'Mulish', sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-top));
        }

        .container {
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 32px 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .name {
            font-family: 'Unbounded', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a78bfa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .role {
            font-size: 14px;
            color: #9ca3af;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .services {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .service {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .service:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .service-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .service-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #e8e8e8;
        }

        .service-desc {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Mulish', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #6b7280;
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="avatar">Н</div>
                <h1 class="name">Никита</h1>
                <p class="role">Разработчик</p>
            </div>

            <div class="services">
                <div class="service">
                    <div class="service-icon">🔍</div>
                    <div class="service-title">Парсер Telegram</div>
                    <div class="service-desc">Сбор контактов из групп и каналов, отправка рассылок</div>
                </div>

                <div class="service">
                    <div class="service-icon">🔐</div>
                    <div class="service-title">VPN Швеция</div>
                    <div class="service-desc">Надёжное шифрование, бесплатный триал 2 часа</div>
                </div>

                <div class="service">
                    <div class="service-icon">⚡</div>
                    <div class="service-title">Разработка TMA</div>
                    <div class="service-desc">Telegram Mini Apps, боты, кастомные решения</div>
                </div>
            </div>

            <div class="buttons">
                <button class="btn btn-primary" onclick="openTelegram()">
                    💬 Написать в Telegram
                </button>
                <a href="https://github.com/Goldberg-tech" class="btn btn-secondary">
                    🐙 GitHub
                </a>
            </div>

            <div class="footer">
                <p>@Goldberg_tech</p>
            </div>
        </div>
    </div>

    <script>
        // Telegram Web App интеграция
        if (window.Telegram?.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            tg.disableVerticalSwipes();
        }

        function openTelegram() {
            const username = 'Goldberg_tech';
            const url = `https://t.me/${username}`;
            
            // Если в Telegram Web App, используем API
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.openLink(url);
            } else {
                // Иначе открываем обычную ссылку
                window.open(url, '_blank');
            }
        }

        // Динамическая установка цветов в метатеге theme-color
        if (window.Telegram?.WebApp) {
            const tg = window.Telegram.WebApp;
            if (tg.setHeaderColor) {
                tg.setHeaderColor('#080c14');
            }
            if (tg.setBackgroundColor) {
                tg.setBackgroundColor('#080c14');
            }
        }
    </script>
</body>
</html>
